name: Build GandanSurvey APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Sync Subfolder and Auto-Heal Core Models
        run: |
          python3 - << 'PYEOF'
          import base64, glob, os, shutil, zlib

          candidates = [p for p in glob.glob('*/settings.gradle.kts') if not p.startswith('.')]
          for cand in candidates:
              sub = os.path.dirname(cand)
              print('Syncing files from subfolder:', sub)
              shutil.copytree(sub, '.', dirs_exist_ok=True)
              shutil.rmtree(sub, ignore_errors=True)

          EMBEDDED_FILES = {
              "app/src/main/java/kr/koseco/gandansurvey/v90/model/SurveyModels.kt": "",
              "app/src/main/java/kr/koseco/gandansurvey/v90/coord/KnGeoid18Grid.kt": "",
              "app/src/main/java/kr/koseco/gandansurvey/v90/coord/CoordinateConverter.kt": "",
              "app/src/main/java/kr/koseco/gandansurvey/v90/coord/CalibrationSolver.kt": "",
              "app/src/main/java/kr/koseco/gandansurvey/v90/ui/GandanSurveyViewModel.kt": "",
          }

          for rel_path, b64_data in EMBEDDED_FILES.items():
              os.makedirs(os.path.dirname(rel_path), exist_ok=True)
              content = zlib.decompress(base64.b64decode(b64_data))
              with open(rel_path, 'wb') as f:
                  f.write(content)
              print('Synchronized core file:', rel_path)

          for path in glob.glob('**/src/main/java/**/*.kt', recursive=True):
              with open(path, 'r', encoding='utf-8') as f:
                  txt = f.read()
              new_txt = txt.replace('Arrangement.CenterVertically', 'Alignment.CenterVertically')
              new_txt = new_txt.replace('val btManager = GnssBluetoothManager(', 'val btManager: GnssBluetoothManager = GnssBluetoothManager(')
              new_txt = new_txt.replace('val ntripClient = NtripClient(', 'val ntripClient: NtripClient = NtripClient(')
              if new_txt != txt:
                  with open(path, 'w', encoding='utf-8') as f:
                      f.write(new_txt)
                  print('Patched:', path)
          PYEOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload Installable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GandanSurvey-V90-APK
          path: app/build/outputs/apk/debug/app-debug.apk
