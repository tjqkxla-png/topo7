name: Build GandanSurvey APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Sync Subfolder and Verify Kotlin Syntax
        run: |
          python3 - << 'PYEOF'
          import glob, os, shutil

          # 폴더 통째로 업로드되어 하위 폴더가 생긴 경우 최상위 루트로 자동 동기화
          candidates = [p for p in glob.glob("*/settings.gradle.kts") if not p.startswith(".")]
          for cand in candidates:
              sub = os.path.dirname(cand)
              print("Syncing files from subfolder:", sub)
              shutil.copytree(sub, ".", dirs_exist_ok=True)
              shutil.rmtree(sub, ignore_errors=True)

          def fix_kotlin_bytes(data: bytes) -> bytes:
              out = bytearray()
              i, n = 0, len(data)
              while i < n:
                  b = data[i]
                  if b == 47 and i + 1 < n and data[i+1] == 47:
                      while i < n and data[i] not in (10, 13):
                          out.append(data[i]); i += 1
                      continue
                  if b == 47 and i + 1 < n and data[i+1] == 42:
                      out.extend(data[i:i+2]); i += 2
                      while i + 1 < n and not (data[i] == 42 and data[i+1] == 47):
                          out.append(data[i]); i += 1
                      if i + 1 < n:
                          out.extend(data[i:i+2]); i += 2
                      continue
                  if b == 34 and i + 2 < n and data[i+1] == 34 and data[i+2] == 34:
                      out.extend(b'"""'); i += 3
                      while i + 2 < n and not (data[i] == 34 and data[i+1] == 34 and data[i+2] == 34):
                          out.append(data[i]); i += 1
                      if i + 2 < n:
                          out.extend(b'"""'); i += 3
                      continue
                  if b in (34, 39):
                      q = b
                      out.append(q); i += 1
                      while i < n and data[i] != q:
                          if data[i] == 92 and i + 1 < n:
                              out.extend(data[i:i+2]); i += 2
                          elif data[i] == 13:
                              out.extend(b'\\r'); i += 1
                          elif data[i] == 10:
                              out.extend(b'\\n'); i += 1
                          else:
                              out.append(data[i]); i += 1
                      if i < n:
                          out.append(data[i]); i += 1
                      continue
                  out.append(b); i += 1
              return bytes(out)

          for path in glob.glob("**/src/main/java/**/*.kt", recursive=True):
              with open(path, "rb") as f:
                  raw = f.read()
              fixed = fix_kotlin_bytes(raw)
              txt = fixed.decode("utf-8")
              txt = txt.replace("Arrangement.CenterVertically", "Alignment.CenterVertically")
              final_bytes = txt.encode("utf-8")
              if raw != final_bytes:
                  with open(path, "wb") as f:
                      f.write(final_bytes)
                  print("Repaired:", path)
          PYEOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload Installable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GandanSurvey-V90-APK
          path: app/build/outputs/apk/debug/app-debug.apk
